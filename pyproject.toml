[project]
name = "agrisim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rahul Bavaliya", email = "60642504+rahul-bavaliya@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "celery>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "geoalchemy2>=0.20.0",
    "httpx2>=2.12.0",
    "loguru>=0.7.3",
    "numpy>=2.5.2",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-jose[cryptography]>=3.5.0",
    "redis>=8.1.0",
    "scikit-learn>=1.9.0",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
agrisim = "agrisim:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
