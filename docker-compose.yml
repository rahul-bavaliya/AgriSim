services:
  db:
    image: postgis/postgis:16-3.4
    container_name: agrisim_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agrisim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agrisim"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrisim_redis
    ports:
      - "6379:6379"

  web:
    build: .
    working_dir: /app
    container_name: agrisim_web
    command: uv run uvicorn agrisim.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app 
      - venv-volume:/app/.venv
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agrisim
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    working_dir: /app
    container_name: agrisim_celery
    command: uv run celery -A agrisim.tasks.celery_app worker --loglevel=info
    volumes:
      - .:/app                  # <--- Fixed: map root so uv can read pyproject.toml
      - venv-volume:/app/.venv
    environment:
      - PYTHONPATH=/app/src     # <--- Added: helps celery find the modules easily
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agrisim
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  venv-volume:            # <--- Added: declared here so docker compose stops complaining