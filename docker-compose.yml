services:
  db:
    image: postgis/postgis:latest
    container_name: agrisim_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrisim_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    working_dir: /app
    container_name: agrisim_web
    command: uv run uvicorn agrisim.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - /app/.venv    # <--- Prevents host/.venv from overriding container's .venv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    working_dir: /app
    container_name: agrisim_celery
    command: uv run celery -A agrisim.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - /app/.venv    # <--- Prevents host/.venv from overriding container's .venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    working_dir: /app
    container_name: agrisim_celery_beat
    command: uv run celery -A agrisim.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: